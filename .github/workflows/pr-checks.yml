name: PR Checks — Migration Integrity, CI, Preview Env

# AGENT_03 (agents/agent-03-devops) — PIPELINE states 1-3.
# Runs on every PR touching apps/backend, apps/frontend, or a migration file.
#
# States NOT implemented in this file, on purpose:
#   4. AWAIT_HUMAN_APPROVAL — enforced by the `production` GitHub Environment's
#      required-reviewer rule, configured in repo Settings > Environments, not
#      in workflow YAML. Nothing here can bypass it.
#   5-8 (migrate/deploy/verify/manifest) — see deploy-production.yml, which
#      only runs on push to main, after this workflow (and human review) pass.
#
# PLACEHOLDERS that must be filled in before this workflow can run live —
# search for "REPLACE_ME" for the full list, also see
# docs/ci-cd-required-secrets.md.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed] # closed needed for cleanup-preview-env
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "contracts/api-specs/**"
      - "infra/neon/**"
      - ".github/workflows/pr-checks.yml"

permissions:
  contents: read
  pull-requests: write # to comment the preview URL on the PR
  id-token: write # for Vercel OIDC (falls back to VERCEL_TOKEN if OIDC isn't configured yet)

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1. VALIDATE_MIGRATION_INTEGRITY
  # ---------------------------------------------------------------------
  # Recomputes the checksum of every migration file touched by this PR and
  # compares it against the independently-recorded value in
  # contracts/api-specs/migration-manifest.json. Per agent-03's system
  # prompt: never regenerate the reference value from a second read of the
  # migration file itself — the manifest IS the reference.
  validate-migration-integrity:
    name: Validate migration checksum
    runs-on: ubuntu-latest
    outputs:
      migration-changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect migration file changes
        id: check
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^apps/backend/drizzle/.*\.sql$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recompute checksum and compare against manifest
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          MANIFEST=contracts/api-specs/migration-manifest.json
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST is missing — cannot validate migration integrity. Blocking."
            exit 1
          fi

          MIGRATION_PATH=$(node -pe "require('./${MANIFEST}').migrationPath")
          EXPECTED=$(node -pe "require('./${MANIFEST}').checksum")
          ALGO=$(node -pe "require('./${MANIFEST}').checksumAlgorithm")

          if [ "$ALGO" != "sha256" ]; then
            echo "::error::Unsupported checksum algorithm '$ALGO' in manifest. Blocking."
            exit 1
          fi
          if [ ! -f "$MIGRATION_PATH" ]; then
            echo "::error::Manifest points to $MIGRATION_PATH, which does not exist in this PR. Blocking."
            exit 1
          fi

          ACTUAL=$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checksum mismatch on $MIGRATION_PATH. The migration file was modified after AGENT_01 emitted its manifest checksum. This is a blocking failure, not a warning — immutable migrations do not get hand-edited, including formatting. Aborting pipeline."
            exit 1
          fi
          echo "Checksum verified — $MIGRATION_PATH matches the manifest recorded at $(node -pe "require('./${MANIFEST}').emittedAt")."

  # ---------------------------------------------------------------------
  # 3. RUN_CI_CHECKS (fail closed)
  # ---------------------------------------------------------------------
  ci-checks:
    name: Test / typecheck / lint / a11y
    runs-on: ubuntu-latest
    needs: validate-migration-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci

      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci

      - name: Lint (apps/frontend)
        working-directory: apps/frontend
        run: npm run lint

      - name: Type-check (apps/frontend)
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Type-check (apps/backend)
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Test (apps/backend)
        working-directory: apps/backend
        run: npm test

      - name: Test (apps/frontend)
        working-directory: apps/frontend
        run: npm test

      - name: Install Playwright browsers
        working-directory: apps/frontend
        # Playwright 1.49.x splits headless Chromium into a separate download
        # ("chromium-headless-shell") from full Chromium. axe-audit.mjs calls
        # chromium.launch() with no options, i.e. default headless: true, which
        # resolves to the shell binary — installing just "chromium" leaves it
        # missing. See https://github.com/microsoft/playwright/issues/34306.
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: a11y audit (apps/frontend)
        working-directory: apps/frontend
        run: |
          if [ ! -f scripts/axe-audit.mjs ]; then
            echo "::error::apps/frontend/package.json defines an 'a11y' script (node scripts/axe-audit.mjs) but that file does not exist in the repo. AGENT_02 self-reported this check as part of its stack (@axe-core/playwright, playwright are devDependencies) but the script was never committed. Per FAIL CLOSED, this pipeline does not accept AGENT_02's self-report and blocks here by name instead of skipping silently."
            exit 1
          fi
          npm run a11y

      - name: Build (apps/frontend)
        working-directory: apps/frontend
        run: npm run build

  # ---------------------------------------------------------------------
  # 2. PROVISION_PREVIEW_ENV
  # ---------------------------------------------------------------------
  # Runs only once ci-checks passes, so we don't spend Neon/Vercel resources
  # on a PR that fails basic checks. (Ordering differs slightly from the
  # numbered pipeline in system-prompt.md for cost efficiency; migration
  # integrity is still validated first, unconditionally.)
  provision-preview-env:
    name: Provision Neon branch + Vercel preview
    runs-on: ubuntu-latest
    needs: [validate-migration-integrity, ci-checks]
    environment: preview # preview-scoped secrets only, never production credentials
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install infra/neon deps
        working-directory: infra/neon
        run: npm install

      - name: Create Neon branch for this PR
        id: neon
        working-directory: infra/neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }} # REPLACE_ME: preview-scoped Neon API key, see docs/ci-cd-required-secrets.md
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }} # REPLACE_ME
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node provision_pr_branch.mjs

      - name: Deploy Vercel preview
        id: vercel
        # No working-directory here on purpose: the Vercel project's own
        # Root Directory setting (apps/frontend) already tells the CLI
        # where the app lives, resolved from the repo root. cd'ing into
        # apps/frontend ourselves on top of that doubles the path
        # (apps/frontend/apps/frontend) and breaks `vercel build`.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PREVIEW_DATABASE_URL: ${{ steps.neon.outputs.connection_uri }}
          PREVIEW_DATABASE_OWNER_URL: ${{ steps.neon.outputs.owner_connection_uri }}
          PREVIEW_JWT_SECRET: ${{ secrets.PREVIEW_JWT_SECRET }} # REPLACE_ME: shared across all previews, see docs/ci-cd-required-secrets.md
        run: |
          set -euo pipefail
          # Gap #10 fix: DATABASE_URL is this PR's own Neon branch connection
          # string (fresh every push, since provision_pr_branch.mjs deletes
          # and recreates the branch each time — matches its app_user
          # password rotation). DATABASE_OWNER_URL is that same branch's
          # owner-role connection string — required separately because
          # apps/frontend/lib/db/pool.ts's getIdentityPool() (used only by
          # POST /api/auth/login, to resolve which tenant an email belongs
          # to before any tenant is known) connects via DATABASE_OWNER_URL,
          # not DATABASE_URL. Missed on the first pass of this fix — PR #14's
          # own preview 500'd on login with "DATABASE_OWNER_URL is not set"
          # until this was added; see apps/frontend/lib/db/pool.ts's header
          # comment for why the two pools are separate. JWT_SECRET is
          # intentionally one fixed value shared across every PR's previews
          # (decided over per-PR-generated: simpler, and preview sessions
          # crossing between two disposable preview deployments is an
          # accepted low-stakes tradeoff, not a production-grade isolation
          # requirement).
          #
          # Injected via `vercel deploy`'s own -e/--env flag (run-time env
          # vars scoped to just this one deployment), not `vercel env add`
          # or a local .env file. Two reasons: (1) DATABASE_URL/
          # DATABASE_OWNER_URL change every push, so persisting them as
          # Vercel-project-level Preview env vars would need add+remove
          # every run anyway, with no benefit over passing them directly;
          # (2) apps/frontend/lib/db/pool.ts and lib/auth/session.ts both
          # read process.env lazily inside request handlers, not at module
          # load or build time — so these values only need to exist in the
          # deployed function's runtime env, which is exactly what -e/--env
          # sets (confirmed via `vercel deploy --help` on the pinned 58.7.1
          # CLI: "-e, --env <KEY=VALUE> Specify environment variables during
          # run-time"). Writing to .vercel/.env.preview.local instead would
          # only affect the local `vercel build` step in this CI runner, not
          # the deployed serverless function — it would not actually work.
          if [ -z "$PREVIEW_DATABASE_URL" ]; then
            echo "::error::steps.neon.outputs.connection_uri is empty — the Neon branch step above should have produced this. Refusing to deploy a preview with no DATABASE_URL."
            exit 1
          fi
          if [ -z "$PREVIEW_DATABASE_OWNER_URL" ]; then
            echo "::error::steps.neon.outputs.owner_connection_uri is empty — the Neon branch step above should have produced this. Refusing to deploy a preview with no DATABASE_OWNER_URL (login would 500)."
            exit 1
          fi

          npx vercel@58.7.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

          # DIAGNOSTIC: pinpointing a persistent doubled-path bug
          # (apps/frontend/apps/frontend/package.json ENOENT on `vercel
          # build`) that survives removing working-directory from this
          # step. Printing exactly what `vercel pull` wrote and where, so
          # we can see the real rootDirectory value Vercel's API returned
          # instead of guessing. Safe to delete once root-caused.
          echo "::group::DIAGNOSTIC — .vercel project.json location(s) and contents"
          find . -path ./node_modules -prune -o -name project.json -path '*/.vercel/*' -print -exec cat {} \; 2>/dev/null
          echo "::endgroup::"

          npx vercel@58.7.1 build --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(npx vercel@58.7.1 deploy --prebuilt --token="$VERCEL_TOKEN" \
            --env "DATABASE_URL=$PREVIEW_DATABASE_URL" \
            --env "DATABASE_OWNER_URL=$PREVIEW_DATABASE_OWNER_URL" \
            --env "JWT_SECRET=$PREVIEW_JWT_SECRET")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const url = "${{ steps.vercel.outputs.url }}";
            const body = [
              "**Preview deployment:** " + url,
              "",
              "_Backed by this PR's own Neon branch — real data, isolated from production and every other PR's preview._",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  cleanup-preview-env:
    name: Tear down Neon preview branch on PR close
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install infra/neon deps
        working-directory: infra/neon
        run: npm install

      - name: Delete Neon branch for this PR
        working-directory: infra/neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }} # REPLACE_ME
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }} # REPLACE_ME
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node teardown_pr_branch.mjs
