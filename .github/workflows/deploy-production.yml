name: Deploy to Production

# AGENT_03 — PIPELINE states 4-8.
# Triggers on push to main (i.e. after a PR has already passed pr-checks.yml
# and been merged with human review of its live preview).
#
# STATE 4, AWAIT_HUMAN_APPROVAL, is enforced by `environment: production`
# below. This is a platform-level GitHub control, not a workflow-logic
# check — the deploy-migration and deploy-artifact jobs literally do not
# start until a designated reviewer approves the run in the GitHub UI.
# No step in this file can bypass that. Configuring the `production`
# environment's required-reviewers rule itself is NOT done here — it's a
# one-time repo Settings > Environments change, deliberately kept out of
# version-controlled workflow YAML per agent-03's system prompt ("any
# workflow change touching environment protection rules requires human
# review as a standalone step, never bundled into a deploy PR").
#
# PLACEHOLDERS: search "REPLACE_ME". See docs/ci-cd-required-secrets.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "contracts/api-specs/**"

permissions:
  contents: write # for the deploy-manifest commit in emit-deploy-manifest
  id-token: write # OIDC → Vercel / Neon, avoids standing static credentials

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-flight production deploy

jobs:
  # ---------------------------------------------------------------------
  # 1 (re-check). VALIDATE_MIGRATION_INTEGRITY
  # ---------------------------------------------------------------------
  # Re-validated here, not just trusted from the PR run — main can receive
  # commits pr-checks.yml never saw re-validated against (e.g. a merge
  # commit), and this is the last gate before a real database is touched.
  validate-migration-integrity:
    name: Re-validate migration checksum on main
    runs-on: ubuntu-latest
    outputs:
      migration-changed: ${{ steps.check.outputs.changed }}
      migration-version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - id: check
        run: |
          set -euo pipefail
          MANIFEST=contracts/api-specs/migration-manifest.json
          MIGRATION_PATH=$(node -pe "require('./${MANIFEST}').migrationPath")
          EXPECTED=$(node -pe "require('./${MANIFEST}').checksum")
          echo "version=$(basename "$MIGRATION_PATH")" >> "$GITHUB_OUTPUT"

          if git diff --name-only HEAD~1 HEAD | grep -qF "$MIGRATION_PATH"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ACTUAL=$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Checksum mismatch on main for $MIGRATION_PATH. Blocking — this migration does not proceed to production."
              exit 1
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 3 (re-check, fail closed). RUN_CI_CHECKS on main
  # ---------------------------------------------------------------------
  ci-checks:
    name: Re-verify tests / typecheck / lint / a11y on main
    runs-on: ubuntu-latest
    needs: validate-migration-integrity
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci
      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci
      - working-directory: apps/frontend
        run: npm run lint
      - working-directory: apps/frontend
        run: npx tsc --noEmit
      - working-directory: apps/frontend
        run: npm run build
      - name: Test (apps/backend)
        working-directory: apps/backend
        run: npm test
      - name: Test (apps/frontend)
        working-directory: apps/frontend
        run: npm test

  # ---------------------------------------------------------------------
  # 4. AWAIT_HUMAN_APPROVAL (platform-enforced, not scripted)
  # 5. APPLY_PRODUCTION_MIGRATION
  # ---------------------------------------------------------------------
  deploy-migration:
    name: Apply migration to production (requires environment approval)
    runs-on: ubuntu-latest
    needs: [validate-migration-integrity, ci-checks]
    if: needs.validate-migration-integrity.outputs.migration-changed == 'true'
    environment: production # REPLACE_ME: this Environment + its required-reviewers rule must exist in repo Settings before this job can ever run — it does not exist yet.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Apply migration via Neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_PROD_API_KEY }} # REPLACE_ME: production-scoped, minimally-permissioned, never the same key used for preview branches
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }} # REPLACE_ME
        run: |
          echo "::error::No production migration-apply script exists yet (infra/neon/apply_ephemeral.mjs explicitly never touches production — by design, per its own header comment). REPLACE_ME with a dedicated apply_production.mjs before this can run, written to only ever apply the single checksum-verified migration file, never drop/reset."
          exit 1

  # ---------------------------------------------------------------------
  # 6. DEPLOY_ARTIFACT
  # ---------------------------------------------------------------------
  deploy-artifact:
    name: Promote frontend to production (requires environment approval)
    runs-on: ubuntu-latest
    needs: [validate-migration-integrity, ci-checks, deploy-migration]
    # Runs even if deploy-migration was skipped (no migration in this push),
    # but always waits for it to either succeed or be skipped-not-failed.
    if: |
      always() &&
      needs.ci-checks.result == 'success' &&
      (needs.deploy-migration.result == 'success' || needs.deploy-migration.result == 'skipped')
    environment: production
    outputs:
      vercel-deployment-id: ${{ steps.deploy.outputs.deployment_id }}
      vercel-deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Build with private Sentry source maps, no public source maps
        working-directory: apps/frontend
        env:
          # SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN: REPLACE_ME — no
          # Sentry project confirmed to exist yet, see
          # docs/ci-cd-required-secrets.md item 4. The build itself is real
          # now (@sentry/nextjs is wired into next.config.mjs,
          # instrumentation.ts, instrumentation-client.ts,
          # sentry.{server,edge}.config.ts) and will succeed either way —
          # withSentryConfig skips the source-map upload with a warning,
          # not a build failure, if org/project/token aren't all set. What's
          # guaranteed regardless: productionBrowserSourceMaps is false, so
          # no public source maps ship no matter what. Upload just won't
          # happen until real Sentry credentials are set.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Vercel production
        id: deploy
        working-directory: apps/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx vercel@58.7.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@58.7.1 build --prod --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(npx vercel@58.7.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(basename "$DEPLOYMENT_URL")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 7. VERIFY_HEALTH — failure triggers artifact rollback (never automatic
  #    schema rollback, per ROLLBACK POLICY)
  # ---------------------------------------------------------------------
  verify-health:
    name: Smoke-test live production
    runs-on: ubuntu-latest
    needs: deploy-artifact
    environment: production
    steps:
      - name: Health-check endpoint
        env:
          PROD_URL: ${{ needs.deploy-artifact.outputs.vercel-deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_URL" ]; then
            echo "::error::deploy-artifact produced no deployment URL — cannot health-check. Blocking."
            exit 1
          fi
          # KNOWN GAP: apps/frontend has no /api/health route yet (no
          # backend exists to check the health of either — see the
          # provision-preview-env comment in pr-checks.yml for the same
          # underlying gap). This will legitimately fail until that route
          # is added, which is correct: a real failure, not a fake stub.
          curl -sf --max-time 10 "$PROD_URL/api/health"
      - name: Authenticated smoke path (login + one tenant-scoped read)
        run: |
          echo "::error::No smoke-test credentials/fixture tenant exist yet, and no auth exists in the app to test against (no backend deployed — see DEPLOY_ARTIFACT's known-gap comment). REPLACE_ME with a dedicated read-only smoke-test account once both a real backend and auth exist."
          exit 1

  rollback-on-failed-health:
    name: Roll back frontend deployment (artifact only, never schema)
    runs-on: ubuntu-latest
    needs: [deploy-artifact, verify-health]
    if: failure() && needs.deploy-artifact.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Repoint traffic to last known-healthy Vercel deployment
        working-directory: apps/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          echo "::notice::Per ROLLBACK POLICY: automated rollback is frontend/artifact-only. If verify-health failed for schema-related reasons, the migration itself is NOT reverted here — that requires a human-authored forward-fix migration through the normal pipeline."
          # No target argument: `vercel rollback` with no URL rolls back to
          # the most recent prior production deployment, which is exactly
          # "last known-healthy" as long as every deploy that reached this
          # point already passed its own verify-health (true by induction —
          # this job only runs after the current deploy's own check failed).
          npx vercel@58.7.1 rollback --token="$VERCEL_TOKEN"

  # ---------------------------------------------------------------------
  # 8. EMIT_DEPLOY_MANIFEST
  # ---------------------------------------------------------------------
  emit-deploy-manifest:
    name: Write deploy manifest for AGENT_04
    runs-on: ubuntu-latest
    needs: [deploy-artifact, verify-health]
    if: success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Write manifest
        run: |
          set -euo pipefail
          mkdir -p contracts/deploy-manifests
          SHA="${{ github.sha }}"
          MIGRATION_VERSION="${{ needs.validate-migration-integrity.outputs.migration-version || 'null' }}"
          cat > "contracts/deploy-manifests/${SHA}.json" <<EOF
          {
            "commitSha": "${SHA}",
            "migrationVersion": $( [ "${{ needs.validate-migration-integrity.outputs.migration-changed }}" = "true" ] && echo "\"${MIGRATION_VERSION}\"" || echo null ),
            "migrationChecksum": $( [ "${{ needs.validate-migration-integrity.outputs.migration-changed }}" = "true" ] && node -pe "JSON.stringify(require('./contracts/api-specs/migration-manifest.json').checksum)" || echo null ),
            "artifactVersion": "${{ needs.deploy-artifact.outputs.vercel-deployment-id }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "healthCheckStatus": "pass"
          }
          EOF
          cp "contracts/deploy-manifests/${SHA}.json" contracts/deploy-manifests/latest.json
      - name: Commit manifest
        run: |
          git config user.name "agent-03-devops[bot]"
          git config user.email "REPLACE_ME@example.com" # per system-prompt.md: never left at a default that could misattribute authorship — needs a real bot identity/email before this runs live
          git add contracts/deploy-manifests/
          git commit -m "release: emit deploy manifest for ${{ github.sha }}"
          git push
