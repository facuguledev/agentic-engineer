name: Deploy to Production

# AGENT_03 — PIPELINE states 4-8.
# Triggers on push to main (i.e. after a PR has already passed pr-checks.yml
# and been merged with human review of its live preview).
#
# STATE 4, AWAIT_HUMAN_APPROVAL, is enforced by `environment: production`
# below. This is a platform-level GitHub control, not a workflow-logic
# check — the deploy-migration and deploy-artifact jobs literally do not
# start until a designated reviewer approves the run in the GitHub UI.
# No step in this file can bypass that. Configuring the `production`
# environment's required-reviewers rule itself is NOT done here — it's a
# one-time repo Settings > Environments change, deliberately kept out of
# version-controlled workflow YAML per agent-03's system prompt ("any
# workflow change touching environment protection rules requires human
# review as a standalone step, never bundled into a deploy PR").
#
# PLACEHOLDERS: search "REPLACE_ME". See docs/ci-cd-required-secrets.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - "contracts/api-specs/**"
  # Manual trigger, for re-running the production pipeline against the
  # current tip of main without needing a commit that happens to touch
  # apps/** or contracts/api-specs/** (e.g. after a workflow-only fix like
  # this one, or a deliberate manual re-deploy/rollback exercise).
  workflow_dispatch:

permissions:
  contents: write # for the deploy-manifest commit in emit-deploy-manifest
  id-token: write # OIDC → Vercel / Neon, avoids standing static credentials

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-flight production deploy

jobs:
  # ---------------------------------------------------------------------
  # 1 (re-check). VALIDATE_MIGRATION_INTEGRITY
  # ---------------------------------------------------------------------
  # Re-validated here, not just trusted from the PR run — main can receive
  # commits pr-checks.yml never saw re-validated against (e.g. a merge
  # commit), and this is the last gate before a real database is touched.
  validate-migration-integrity:
    name: Re-validate migration checksum on main
    runs-on: ubuntu-latest
    outputs:
      migration-changed: ${{ steps.check.outputs.changed }}
      migration-version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - id: check
        run: |
          set -euo pipefail
          MANIFEST=contracts/api-specs/migration-manifest.json
          MIGRATION_PATH=$(node -pe "require('./${MANIFEST}').migrationPath")
          EXPECTED=$(node -pe "require('./${MANIFEST}').checksum")
          echo "version=$(basename "$MIGRATION_PATH")" >> "$GITHUB_OUTPUT"

          if git diff --name-only HEAD~1 HEAD | grep -qF "$MIGRATION_PATH"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            ACTUAL=$(sha256sum "$MIGRATION_PATH" | awk '{print $1}')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Checksum mismatch on main for $MIGRATION_PATH. Blocking — this migration does not proceed to production."
              exit 1
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------
  # 3 (re-check, fail closed). RUN_CI_CHECKS on main
  # ---------------------------------------------------------------------
  ci-checks:
    name: Re-verify tests / typecheck / lint / a11y on main
    runs-on: ubuntu-latest
    needs: validate-migration-integrity
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: apps/frontend
        run: npm ci
      - name: Install backend deps
        working-directory: apps/backend
        run: npm ci
      - working-directory: apps/frontend
        run: npm run lint
      - working-directory: apps/frontend
        run: npx tsc --noEmit
      - working-directory: apps/frontend
        run: npm run build
      - name: Test (apps/backend)
        working-directory: apps/backend
        run: npm test
      - name: Test (apps/frontend)
        working-directory: apps/frontend
        run: npm test

  # ---------------------------------------------------------------------
  # 4. AWAIT_HUMAN_APPROVAL (platform-enforced, not scripted)
  # 5. APPLY_PRODUCTION_MIGRATION
  # ---------------------------------------------------------------------
  deploy-migration:
    name: Apply migration to production (requires environment approval)
    runs-on: ubuntu-latest
    needs: [validate-migration-integrity, ci-checks]
    if: needs.validate-migration-integrity.outputs.migration-changed == 'true'
    environment: production # Exists with required-reviewers configured — this job cannot start until a reviewer approves it in the GitHub UI.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install infra/neon deps
        working-directory: infra/neon
        run: npm install
      - name: Apply migration via Neon
        working-directory: infra/neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_PROD_API_KEY }} # REPLACE_ME: production-scoped, minimally-permissioned, never the same key used for preview branches
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }} # REPLACE_ME
          NEON_PROD_BRANCH_ID: ${{ secrets.NEON_PROD_BRANCH_ID }} # REPLACE_ME: explicit branch ID, never looked up by name — see apply_production.mjs's own guard
        run: node apply_production.mjs

  # ---------------------------------------------------------------------
  # 6. DEPLOY_ARTIFACT
  # ---------------------------------------------------------------------
  deploy-artifact:
    name: Promote frontend to production (requires environment approval)
    runs-on: ubuntu-latest
    needs: [validate-migration-integrity, ci-checks, deploy-migration]
    # Runs even if deploy-migration was skipped (no migration in this push),
    # but always waits for it to either succeed or be skipped-not-failed.
    if: |
      always() &&
      needs.ci-checks.result == 'success' &&
      (needs.deploy-migration.result == 'success' || needs.deploy-migration.result == 'skipped')
    environment: production
    outputs:
      vercel-deployment-id: ${{ steps.deploy.outputs.deployment_id }}
      vercel-deployment-url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Build with private Sentry source maps, no public source maps
        working-directory: apps/frontend
        env:
          # SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN: REPLACE_ME — no
          # Sentry project confirmed to exist yet, see
          # docs/ci-cd-required-secrets.md item 4. The build itself is real
          # now (@sentry/nextjs is wired into next.config.mjs,
          # instrumentation.ts, instrumentation-client.ts,
          # sentry.{server,edge}.config.ts) and will succeed either way —
          # withSentryConfig skips the source-map upload with a warning,
          # not a build failure, if org/project/token aren't all set. What's
          # guaranteed regardless: productionBrowserSourceMaps is false, so
          # no public source maps ship no matter what. Upload just won't
          # happen until real Sentry credentials are set.
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Vercel production
        id: deploy
        # No working-directory: the Vercel project's Root Directory
        # (apps/frontend) is resolved from the repo root by the CLI itself —
        # see the matching comment in pr-checks.yml for the doubled-path bug
        # this avoids.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx vercel@58.7.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@58.7.1 build --prod --token="$VERCEL_TOKEN"
          DEPLOYMENT_URL=$(npx vercel@58.7.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$(basename "$DEPLOYMENT_URL")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 7. VERIFY_HEALTH — failure triggers artifact rollback (never automatic
  #    schema rollback, per ROLLBACK POLICY)
  # ---------------------------------------------------------------------
  verify-health:
    name: Smoke-test live production
    runs-on: ubuntu-latest
    needs: deploy-artifact
    # Explicit override, same reasoning as deploy-artifact's own `if:`.
    # Without this, GitHub's default `if: success()` is evaluated against
    # the whole transitive ancestor chain, not just this job's direct
    # `needs`. deploy-migration (deploy-artifact's own dependency, two
    # hops up) is legitimately `skipped` whenever a PR touches no
    # migration file, and that skip propagates forward through success()
    # even though deploy-artifact itself handled it and succeeded —
    # causing this job to skip in cascade despite deploy-artifact being a
    # real success. Confirmed live: this exact case happened on the first
    # production run (migration correctly skipped, deploy-artifact
    # succeeded, verify-health silently skipped instead of running).
    if: always() && needs.deploy-artifact.result == 'success'
    environment: production
    steps:
      - name: Health-check endpoint
        env:
          PROD_URL: ${{ needs.deploy-artifact.outputs.vercel-deployment-url }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_URL" ]; then
            echo "::error::deploy-artifact produced no deployment URL — cannot health-check. Blocking."
            exit 1
          fi
          curl -sf --max-time 10 "$PROD_URL/api/health"
      - name: Authenticated smoke path (login + one tenant-scoped read)
        env:
          PROD_URL: ${{ needs.deploy-artifact.outputs.vercel-deployment-url }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_TEST_EMAIL" ]; then
            echo "::error::SMOKE_TEST_EMAIL is not set on the production environment — cannot run the authenticated smoke path. Add it as an environment secret (see docs/ci-cd-required-secrets.md, external prerequisite #7)."
            exit 1
          fi

          # Dedicated read-only smoke-test tenant/user, seeded once directly
          # in production (see docs/ci-cd-required-secrets.md). Auth is
          # deliberately email-only in v1 (see
          # apps/frontend/app/api/auth/login/route.ts) — knowing this email
          # is equivalent to a credential, which is why it lives in secrets,
          # not vars.
          COOKIE_JAR=$(mktemp)

          LOGIN_STATUS=$(curl -s --max-time 10 -o /tmp/smoke-login-body.json -w '%{http_code}' \
            -c "$COOKIE_JAR" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_TEST_EMAIL\"}" \
            "$PROD_URL/api/auth/login")
          if [ "$LOGIN_STATUS" != "200" ]; then
            echo "::error::Smoke-test login returned $LOGIN_STATUS, expected 200. Body: $(cat /tmp/smoke-login-body.json)"
            exit 1
          fi

          TENANT_STATUS=$(curl -s --max-time 10 -o /tmp/smoke-tenant-body.json -w '%{http_code}' \
            -b "$COOKIE_JAR" \
            "$PROD_URL/api/tenant")
          if [ "$TENANT_STATUS" != "200" ]; then
            echo "::error::Smoke-test tenant-scoped read returned $TENANT_STATUS, expected 200. Body: $(cat /tmp/smoke-tenant-body.json)"
            exit 1
          fi

          TENANT_SLUG=$(node -pe "JSON.parse(require('fs').readFileSync('/tmp/smoke-tenant-body.json','utf8')).slug")
          if [ "$TENANT_SLUG" != "ci-smoke-test" ]; then
            echo "::error::Tenant-scoped read returned slug '$TENANT_SLUG', expected 'ci-smoke-test' — session/RLS tenant scoping may be broken."
            exit 1
          fi

          echo "Authenticated smoke path passed: logged in as the smoke-test account, tenant-scoped read returned the correct tenant."

  rollback-on-failed-health:
    name: Roll back frontend deployment (artifact only, never schema)
    runs-on: ubuntu-latest
    needs: [deploy-artifact, verify-health]
    if: failure() && needs.deploy-artifact.result == 'success'
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Repoint traffic to last known-healthy Vercel deployment
        # Same reasoning as the deploy steps: no working-directory, the CLI
        # resolves the project via VERCEL_ORG_ID/VERCEL_PROJECT_ID directly,
        # it doesn't need local file access for a pure rollback.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # BUG FIX: this step's comment above always claimed the CLI
          # "resolves the project via VERCEL_ORG_ID/VERCEL_PROJECT_ID
          # directly" but those two env vars were never actually set here.
          # Without them, `vercel rollback` has no linked project to work
          # from and falls back to auto-creating/detecting a project from
          # the current directory name — confirmed live: it silently
          # created a brand-new "agentic-engineer" project (wrong one) and
          # did nothing, instead of rolling back "agentic-engineer-frontend".
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          echo "::notice::Per ROLLBACK POLICY: automated rollback is frontend/artifact-only. If verify-health failed for schema-related reasons, the migration itself is NOT reverted here — that requires a human-authored forward-fix migration through the normal pipeline."

          # BUG FIX: `vercel rollback` with no argument does NOT roll back
          # to the previous production deployment, despite what the old
          # comment here claimed. Confirmed live: it prints "Checking
          # rollback status... No deployment rollback in progress" — that's
          # the `vercel rollback status` behavior, not an actual rollback.
          # There is no documented "roll back to previous, no args needed"
          # form in this CLI version. We resolve the real previous
          # production deployment ourselves via the Vercel API and pass it
          # explicitly, which is the only form `vercel rollback` actually
          # supports: `vercel rollback [deployment-id or url]`.
          # limit=10 + filter to readyState === READY: on a Hobby plan,
          # Vercel only allows rolling back to the single immediately-
          # previous deployment, so picking the wrong index here (e.g. a
          # deployment that errored mid-build, or a stray one from
          # Vercel's native Git integration racing our own CLI deploy
          # before apps/frontend/vercel.json's deploymentEnabled: false
          # took effect) causes a 402 "further than the previous
          # deployment" error even though it's literally index [1] of the
          # unfiltered list. Filtering to READY-only is a best-effort fix
          # for that noise, not a full guarantee — see
          # docs/ci-cd-required-secrets.md gap #7b for the full story.
          DEPLOYMENTS=$(curl -sf \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}&target=production&limit=10")
          PREVIOUS_URL=$(echo "$DEPLOYMENTS" | node -pe "
            const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const ready = (d.deployments || []).filter((x) => x.state === 'READY' || x.readyState === 'READY');
            ready[1] ? ready[1].url : ''
          ")
          if [ -z "$PREVIOUS_URL" ]; then
            echo "::error::No prior production deployment found to roll back to (this looks like the first production deployment ever for this project — there is nothing 'last known-healthy' to repoint traffic to). Human investigation required."
            exit 1
          fi
          echo "Rolling back to previous production deployment: https://${PREVIOUS_URL}"
          # --yes: non-interactive confirmation, required on a CI runner
          # (no TTY to answer the y/n prompt otherwise).
          npx vercel@58.7.1 rollback "https://${PREVIOUS_URL}" --yes --token="$VERCEL_TOKEN"

  # ---------------------------------------------------------------------
  # 8. EMIT_DEPLOY_MANIFEST
  # ---------------------------------------------------------------------
  emit-deploy-manifest:
    name: Write deploy manifest for AGENT_04
    runs-on: ubuntu-latest
    needs: [deploy-artifact, verify-health]
    # Explicit override, not the default `success()` — same transitive-
    # ancestor-skip issue documented on verify-health's `if:` above.
    # Checking only this job's direct needs, so a legitimately-skipped
    # deploy-migration (no new migration in this deploy) never blocks the
    # manifest from being written once deploy-artifact and verify-health
    # both genuinely succeed.
    if: always() && needs.deploy-artifact.result == 'success' && needs.verify-health.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Write manifest
        run: |
          set -euo pipefail
          mkdir -p contracts/deploy-manifests
          SHA="${{ github.sha }}"
          MIGRATION_VERSION="${{ needs.validate-migration-integrity.outputs.migration-version || 'null' }}"
          cat > "contracts/deploy-manifests/${SHA}.json" <<EOF
          {
            "commitSha": "${SHA}",
            "migrationVersion": $( [ "${{ needs.validate-migration-integrity.outputs.migration-changed }}" = "true" ] && echo "\"${MIGRATION_VERSION}\"" || echo null ),
            "migrationChecksum": $( [ "${{ needs.validate-migration-integrity.outputs.migration-changed }}" = "true" ] && node -pe "JSON.stringify(require('./contracts/api-specs/migration-manifest.json').checksum)" || echo null ),
            "artifactVersion": "${{ needs.deploy-artifact.outputs.vercel-deployment-id }}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "healthCheckStatus": "pass"
          }
          EOF
          cp "contracts/deploy-manifests/${SHA}.json" contracts/deploy-manifests/latest.json
      - name: Commit manifest
        run: |
          git config user.name "agent-03-devops[bot]"
          git config user.email "facundoguledjian@gmail.com" # bot identity for this repo's deploy-manifest commits, set by the repo owner
          git add contracts/deploy-manifests/
          git commit -m "release: emit deploy manifest for ${{ github.sha }}"
          git push
